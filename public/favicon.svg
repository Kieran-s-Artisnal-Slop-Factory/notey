  <line x1="5" y1="20.5" x2="26" y2="20.5" stroke="#28439c" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="5" y1="24.5" x2="18" y2="24.5" stroke="#28439c" stroke-width="1.6" stroke-linecap="round"/>
